<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="styles5.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="game">
            <div id="Home">
                <h1>HOME</h1>
                <h1 id="homescore">0</h1>
                <div class = "buttonwrapper">
                    <button id="home1" onclick="home1()">+1</button>
                    <button id="home2" onclick="home2()">+2</button>
                    <button id="home3" onclick="home3()">+3</button>
                </div>
            </div>
            <div id="Away">
                <h1>AWAY</h1>
                <h1 id="awayscore">0</h1>
                <div class = "buttonwrapper">
                    <button id="away1" onclick="away1()">+1</button>
                    <button id="away2" onclick="away2()">+2</button>
                    <button id="away3" onclick="away3()">+3</button>
                </div>
            </div>
        </div>
        <h2 id="leader"></h2>
        <button id="newgame" onclick="newgame()">NEW GAME</button>
        <script src="index.js"></script>
    </body>
</html>
